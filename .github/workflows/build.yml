name: Byg Jarvis TV launcher

on:
  push:
    # main giver stabile versioner; claude/** grene giver test versioner (pre-release)
    branches: [main, "claude/**"]
    paths-ignore:
      - "README.md"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.10.2"

      - name: Fast signeringsnøgle fra secrets
        env:
          KS_B64: ${{ secrets.JARVIS_KEYSTORE_B64 }}
          KS_PASS: ${{ secrets.JARVIS_KEYSTORE_PASS }}
        run: |
          if [ -z "$KS_B64" ]; then
            # Uden den faste nøgle kan sticks ikke opdatere sig selv, så der bygges ingen release
            echo "::error::Mangler JARVIS_KEYSTORE_B64 og JARVIS_KEYSTORE_PASS. Kør lav-noegle.ps1."
            exit 1
          fi
          echo "$KS_B64" | base64 -d > "$RUNNER_TEMP/jarvis.p12"
          alias=$(keytool -list -keystore "$RUNNER_TEMP/jarvis.p12" -storetype pkcs12 -storepass "$KS_PASS" \
            | grep -i "PrivateKeyEntry" | head -1 | sed 's/, .*//')
          echo "JARVIS_KEYSTORE=$RUNNER_TEMP/jarvis.p12" >> "$GITHUB_ENV"
          echo "JARVIS_KEY_ALIAS=$alias" >> "$GITHUB_ENV"

      - name: Versionsnummer og kanal
        # Fortsætter efter CSS-Jellyfin (1 til 9), så versioner aldrig går baglæns
        run: |
          echo "JARVIS_VERSION=$((GITHUB_RUN_NUMBER + 100))" >> "$GITHUB_ENV"
          if [ "$GITHUB_REF_NAME" = "main" ]; then echo "JARVIS_CHANNEL=stabil" >> "$GITHUB_ENV"; else echo "JARVIS_CHANNEL=test" >> "$GITHUB_ENV"; fi

      - name: Byg APK
        env:
          JARVIS_KEYSTORE_PASS: ${{ secrets.JARVIS_KEYSTORE_PASS }}
        run: gradle --no-daemon assembleRelease

      - name: Saml filer
        run: |
          mkdir out
          cp app/build/outputs/apk/release/app-release.apk out/jarvis-tv.apk
          cp install.ps1 undo.ps1 lav-noegle.ps1 out/

      - uses: actions/upload-artifact@v4
        with:
          name: jarvis-tv
          path: out/

      - name: Udgiv som release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="launcher-v${JARVIS_VERSION}"
          # Commit beskeden bliver til "Nyt i denne version" på tv'et (uden tekniske trailers)
          git log -1 --format=%B | grep -vE '^(Co-Authored-By|Claude-Session):' > notes.txt
          if [ "$JARVIS_CHANNEL" = "test" ]; then
            # Test version: kun sticks på kanal Test henter den; venner og stabile sticks ser den ikke
            gh release create "$tag" out/* --target "$GITHUB_SHA" --title "Jarvis TV ${JARVIS_VERSION} (test)" \
              --notes-file notes.txt --prerelease --latest=false
          else
            gh release create "$tag" out/* --target "$GITHUB_SHA" --title "Jarvis TV ${JARVIS_VERSION}" \
              --notes-file notes.txt --latest
          fi
