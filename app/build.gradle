plugins {
    id "com.android.application"
}

android {
    namespace "dk.selveste.launcher"
    // 36 fordi Rive bruger nyere AndroidX; targetSdk (opførslen på tv'et) er uændret
    compileSdk 36

    defaultConfig {
        applicationId "dk.selveste.launcher"
        minSdk 25
        targetSdk 34
        // JARVIS_VERSION sættes af workflowet (SebTV-OS fortsætter fra 100, så tal aldrig går baglæns)
        def v = System.getenv("JARVIS_VERSION") ?: System.getenv("GITHUB_RUN_NUMBER") ?: "1"
        versionCode v.toInteger()
        versionName "1.0." + v + (System.getenv("JARVIS_CHANNEL") == "test" ? "-test" : "")
        // Kun ARM (Fire TV og Google TV); Rives afspiller fylder ellers dobbelt
        ndk { abiFilters "armeabi-v7a", "arm64-v8a" }
    }

    packaging {
        // Pak Rives .so filer komprimeret, så selvopdateringen henter mindre
        jniLibs { useLegacyPackaging true }
    }

    signingConfigs {
        // Fast nøgle fra GitHub secrets (lav-noegle.ps1), så selvopdatering virker.
        // Nøglen ligger aldrig i repoet.
        jarvis {
            def ks = System.getenv("JARVIS_KEYSTORE")
            if (ks) {
                storeFile file(ks)
                storeType "pkcs12"
                storePassword System.getenv("JARVIS_KEYSTORE_PASS")
                keyAlias System.getenv("JARVIS_KEY_ALIAS")
                keyPassword System.getenv("JARVIS_KEYSTORE_PASS")
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            // Uden secret: runnerens debug nøgle, og install.ps1 geninstallerer ved nøgleskift
            signingConfig System.getenv("JARVIS_KEYSTORE") ? signingConfigs.jarvis : signingConfigs.debug
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    testOptions {
        // Tests kører på pc'en uden Android; Android kald svarer bare 0/null
        unitTests.returnDefaultValues = true
    }

    lint {
        abortOnError false
        checkReleaseBuilds false
    }
}

dependencies {
    implementation "io.nayuki:qrcodegen:1.8.0"
    // Rive: animationer lavet i Rive editoren (.riv), tegnet på grafikchippen
    implementation "app.rive:rive-android:11.16.2"
    testImplementation "junit:junit:4.13.2"
    // Rigtig org.json i tests (Androids egen er kun en tom stub uden for tv'et)
    testImplementation "org.json:json:20240303"
}
